<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VirtualPC</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="topbar">
        <div class="logo">
            <span class="logo-icon">▣</span>
            <span>VirtualPC</span>
        </div>

        <button class="settings">⚙</button>
    </header>

    <main class="home">

        <section class="hero">
            <span class="badge">VIRTUAL MACHINE</span>

            <h1>Seu PC.<br><span>Virtualizado.</span></h1>

            <p>
                Crie sua própria máquina virtual,
                escolha os recursos e abra sua VM
                quando quiser.
            </p>

            <button class="create-button"
                    onclick="window.location.href='criar-vm.html'">

                <span>＋</span>
                Criar nova VM

            </button>
        </section>

        <section class="empty-card">

            <div class="computer-icon">
                🖥️
            </div>

            <h2>Nenhuma VM criada</h2>

            <p>
                Sua lista de máquinas virtuais
                aparecerá aqui.
            </p>

        </section>

    </main>

    <nav class="bottom-nav">

        <a class="nav-item active" href="index.html">
            <span>⌂</span>
            <small>Início</small>
        </a>

        <a class="nav-item" href="criar-vm.html">
            <span>＋</span>
            <small>Criar VM</small>
        </a>

        <a class="nav-item">
            <span>⚙</span>
            <small>Ajustes</small>
        </a>

    </nav>

</body>
</html>
