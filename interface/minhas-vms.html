<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas VMs - VirtualPC</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/home.css">
</head>

<body>

<header class="topbar">

    <div class="logo">
        <span class="logo-icon">▣</span>
        <span>VirtualPC</span>
    </div>

    <button class="settings">⚙</button>

</header>

<main class="home">

    <section class="page-title">

        <span class="badge">VIRTUAL MACHINES</span>

        <h1>Minhas VMs</h1>

        <p>
            Gerencie e abra suas máquinas virtuais.
        </p>

    </section>

    <section id="vmContainer" class="vm-container">

        <!-- As VMs serão carregadas aqui -->

    </section>

    <button
        class="create-button"
        onclick="window.location.href='criar-vm.html'">

        <span>＋</span>
        Criar nova VM

    </button>

</main>

<nav class="bottom-nav">

    <a class="nav-item" href="index.html">
        <span>⌂</span>
        <small>Início</small>
    </a>

    <a class="nav-item active" href="minhas-vms.html">
        <span>▣</span>
        <small>Minhas VMs</small>
    </a>

    <a class="nav-item" href="#">
        <span>⚙</span>
        <small>Ajustes</small>
    </a>

</nav>

<script>

function carregarVMs() {

    const container =
        document.getElementById("vmContainer");

    const dados =
        localStorage.getItem("virtualPC_vm");

    if (!dados) {

        container.innerHTML = `
            <div class="empty-card">

                <div class="computer-icon">
                    🖥️
                </div>

                <h2>Nenhuma VM criada</h2>

                <p>
                    Crie sua primeira máquina virtual
                    para começar.
                </p>

            </div>
        `;

        return;
    }

    const vm = JSON.parse(dados);

    container.innerHTML = `

        <div class="vm-card">

            <div class="vm-card-top">

                <div class="vm-icon">
                    🖥️
                </div>

                <div>
                    <h2>${vm.nome}</h2>

                    <span class="vm-status">
                        ● Desligada
                    </span>
                </div>

            </div>

            <div class="vm-specs">

                <div>
                    <small>RAM</small>
                    <strong>${vm.ram} GB</strong>
                </div>

                <div>
                    <small>CPU</small>
                    <strong>${vm.cpu} núcleos</strong>
                </div>

                <div>
                    <small>DISCO</small>
                    <strong>${vm.storage} GB</strong>
                </div>

            </div>

            <button
                class="open-vm-button"
                onclick="abrirVM()">

                ▶ Abrir VM

            </button>

        </div>

    `;
}

function abrirVM() {

    window.location.href = "vm.html";

}

carregarVMs();

</script>

</body>
</html>
